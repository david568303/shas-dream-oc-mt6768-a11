name: Build Kernel and Release ZIP

on:
  push:
    branches: 
      - kernelsu-next

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest  # Uses Ubuntu runner

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: shas-dream-oc-mt6768  # Your repo's directory name

    - name: Install Dependencies
      run: |
        cd ~/
        sudo apt-get update
        sudo apt-get install -y git make gcc bc flex bison libelf-dev build-essential zlib1g-dev libncurses5-dev libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev libssl-dev
        wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        tar xzf Python-2.7.18.tgz
        cd Python-2.7.18
        ./configure
        make
        sudo make altinstall
    - name: Cache Proton Clang
      uses: actions/cache@v4
      with:
        path: shas-dream-oc-mt6768/clang-13/aaa
        key: ${{ runner.os }}-proton-clang

    - name: Set Up Toolchain
      if: steps.cache-proton-clang.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git shas-dream-oc-mt6768/clang-13/aaa


    - name: Build Kernel
      run: |
        cd shas-dream-oc-mt6768
        ./merlin.sh  # Replace with your actual build script

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: shas-dream-oc-mt6768/AnyKernel3-master/*.zip  # Path to generated ZIP
        retention-days: 1

    # Optional: Auto-create GitHub Release
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: shas-dream-oc-mt6768/AnyKernel3-master/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
