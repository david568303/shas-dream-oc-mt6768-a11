name: TESTS

on:
  push:
    branches: [ main ]  # Trigger on push to main branch
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest  # Uses Ubuntu runner

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: shas-dream-oc-mt6768  # Your repo's directory name

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make gcc bc libssl-dev flex bison libelf-dev

    - name: Set Up Proton Clang
      run: |
        mkdir -p shas-dream-oc-mt6768/clang-13/aaa
        git clone https://github.com/kdrag0n/proton-clang.git shas-dream-oc-mt6768/clang-13/aaa

    - name: Build Kernel
      run: |
        cd shas-dream-oc-mt6768
        chmod +x merlin.sh
        ./merlin.sh

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: shas-dream-oc-mt6768/AnyKernel3-master/*.zip  # Path to generated ZIP
        retention-days: 1

