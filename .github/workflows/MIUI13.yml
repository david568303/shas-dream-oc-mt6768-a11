name: Build Kernel for MIUI 13

on:
  push:
    branches:
      - merlin-r-oss-MIUI-13
  pull_request:
    branches:
      - merlin-r-oss-MIUI-13
  workflow_dispatch:  # Correctly placed

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest  # Uses Ubuntu runner

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: shas-dream-oc-mt6768  # Your repo's directory name

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make gcc bc libssl-dev flex bison libelf-dev

    - name: Set Up Proton Clang
      run: |
        mkdir -p shas-dream-oc-mt6768/clang-13/aaa
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git shas-dream-oc-mt6768/clang-13/aaa

    - name: Build Kernel
      run: |
        cd shas-dream-oc-mt6768
        chmod +x lancelotp.sh  # Or merlinp.sh depending on your target
        ./lancelotp.sh         # Replace with the correct build script

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Kernel-ZIP
        path: shas-dream-oc-mt6768/AnyKernel3-master/*.zip  # Adjust if needed
        retention-days: 1

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: shas-dream-oc-mt6768/AnyKernel3-master/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
